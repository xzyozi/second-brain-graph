# ==============================================================================
# Second Brain OS - モデルおよび実行バックエンド構成定義 (models.yaml)
# ==============================================================================
# 本設定は、自律マルチエージェントパイプライン（Planner, Coder, Reviewer 等）が
# 利用する推論モデルおよび agy バックエンドルーティングを定義します。
# 従来のローカルLLM設定は legacy/local_llm/ および v0.9.0-pre-agy-migration を参照。

# 各ロール別モデルハイパーパラメータ
models:
  planner:
    description: "汎用・設計・計画用モデル (spec_draft / task_decomposition)"
    temperature: 0.2
    max_tokens: 35000

  coder:
    description: "コード記述特化モデル (code_edit / aider_edit)"
    temperature: 0.1
    max_tokens: 35000

  reviewer:
    description: "汎用・コード監査・レビュー用モデル (code_review / failure_analysis)"
    temperature: 0.1
    max_tokens: 35000

# バックエンド実行およびルーティング
backend_execution:
  mode: "exclusive"
  fallback: "disabled"
  gpu_lease_timeout: 120

  # agy外部送信ポリシー。allowlistへ切り替えるまで既存運用を止めない互換モード。
  # allowlist時は、検証済みのproject keyだけをagyへ送信できる。
  agy_external_send:
    mode: "allow_all"
    allowed_project_keys: []
    reject_secret_files: false

  # タスクインテントから実行プロファイルへのマッピング
  routes:
    spec_draft: "agy_default"
    task_decomposition: "agy_default"
    task_prioritization: "agy_default"
    code_edit: "agy_default"
    aider_edit: "agy_default"
    code_review: "agy_default"
    failure_analysis: "agy_default"
    test_feedback: "agy_default"

  # バックエンドプロファイル定義
  profiles:
    agy_default:
      backend: "agy"
      model: "agy-default"
      timeout: 1200
